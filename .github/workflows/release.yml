name: Release

# Push a tag `vX.Y.Z` (matching the version in crates/frontline/Cargo.toml) and this runs CI, builds
# Frontline for Linux, Windows and macOS (Apple silicon and Intel) and publishes a GitHub release
# with the archives.
#
# Linux and Windows build on GitHub's runners. macOS builds on the maintainer's own Mac (a
# self-hosted runner labelled `frontline-release`, see README > CI and releases), because GitHub
# bills macOS minutes at 10x. If that runner is not online, the macOS jobs wait for it.
#
# Run it by hand (Actions > Release > Run workflow) to build the archives without releasing:
# they are attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: Which platforms to build
        type: choice
        options: [all, macos, linux-windows]
        default: all
      run_checks:
        description: Run format, clippy and tests first
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          all='[
            {"target":"x86_64-unknown-linux-gnu","runs_on":"ubuntu-24.04","mac":false},
            {"target":"x86_64-pc-windows-msvc","runs_on":"windows-latest","mac":false},
            {"target":"aarch64-apple-darwin","runs_on":["self-hosted","macOS","ARM64","frontline-release"],"mac":true},
            {"target":"x86_64-apple-darwin","runs_on":["self-hosted","macOS","ARM64","frontline-release"],"mac":true}
          ]'
          case "$TARGETS" in
            macos)         filter='map(select(.mac))' ;;
            linux-windows) filter='map(select(.mac | not))' ;;
            *)             filter='.' ;;
          esac
          echo "matrix=$(jq -c "$filter" <<< "$all")" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    if: github.event_name == 'push' || inputs.run_checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [plan, ci]
    # `ci` is skipped on a dry run that turns the checks off; a failed check still blocks.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Name the build
        id: meta
        shell: bash
        run: |
          version=$(grep -m1 '^version' crates/frontline/Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the crate version ${version}; bump crates/frontline/Cargo.toml and tag again"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then label="${GITHUB_REF_NAME}"; else label="v${version}-${GITHUB_SHA::7}"; fi
          echo "name=frontline-${label}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: echo "archive=$(tools/ci/package.sh ${{ matrix.target }} ${{ steps.meta.outputs.name }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      # The self-hosted Mac has little spare disk: give the build folder back after every job.
      - name: Free the build folder
        if: ${{ always() && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          rm -rf "${CARGO_TARGET_DIR:?}" dist

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: archives
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes --title "Frontline ${GITHUB_REF_NAME}")
          # A tag with a suffix (v0.2.0-rc1) is a pre-release.
          [[ ${GITHUB_REF_NAME} == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" archives/* "${flags[@]}"
