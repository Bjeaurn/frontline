[package]
name = "mapedit"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MapEdit: look at, check and (later) edit Frontline Maps, on the game's own rendering"

[features]
# Faster incremental builds during development: `cargo run -p mapedit --features dev`.
dev = ["bevy/dynamic_linking"]

[dependencies]
frontline = { path = "../frontline" }
# bevy_remote + http: remote control over Bevy's remote protocol (src/remote.rs).
bevy = { workspace = true, features = ["jpeg", "bevy_remote"] }
avian3d.workspace = true
clap.workspace = true
serde_json = "1"
ron.workspace = true

[lints]
workspace = true
