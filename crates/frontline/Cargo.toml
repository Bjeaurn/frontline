[package]
name = "frontline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Faster incremental builds during development: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy.workspace = true
lightyear = { workspace = true, features = [
  "std",
  "client",
  "server",
  "udp",
  "netcode",
  "replication",
  "interpolation",
] }
avian3d.workspace = true
clap.workspace = true
serde.workspace = true
ron.workspace = true
dirs.workspace = true

[lints]
workspace = true
