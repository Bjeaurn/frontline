[package]
name = "frontline"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Faster incremental builds during development: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]

[dependencies]
# JPEG decoding for the embedded surface textures (src/materials.rs).
bevy = { workspace = true, features = ["jpeg"] }
lightyear = { workspace = true, features = [
  "std",
  "client",
  "server",
  "udp",
  "netcode",
  "replication",
  "interpolation",
] }
bevy_replicon.workspace = true
avian3d.workspace = true
bevy_trenchbroom.workspace = true
clap.workspace = true
serde.workspace = true
ron.workspace = true
dirs.workspace = true
zip.workspace = true

[lints]
workspace = true
